<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Upper Wing Facet Gradient -->
    <linearGradient id="aeroFacetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8a36c" />
      <stop offset="45%" stop-color="#e58244" />
      <stop offset="100%" stop-color="#bf5f24" />
    </linearGradient>

    <!-- Wing Shade / Inner Depth Facet -->
    <linearGradient id="aeroFacetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d96e2e" />
      <stop offset="60%" stop-color="#a64614" />
      <stop offset="100%" stop-color="#692405" />
    </linearGradient>

    <!-- Center Spine Highlight -->
    <linearGradient id="aeroSpine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#f2965c" />
      <stop offset="100%" stop-color="#c96020" />
    </linearGradient>

    <!-- Drop Shadow & Tactile Clay Bevel -->
    <filter id="clayShieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#e58244" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#clayShieldGlow)">
    <!-- Primary Outer Delta Wings (Left & Right) -->
    <!-- Left Main Wing -->
    <path d="M 50,10 L 12,50 L 26,62 L 50,38 Z" 
          fill="url(#aeroFacetTop)" 
          stroke="rgba(255, 255, 255, 0.45)" 
          stroke-width="1.2" 
          stroke-linejoin="round" />

    <!-- Right Main Wing -->
    <path d="M 50,10 L 88,50 L 74,62 L 50,38 Z" 
          fill="url(#aeroFacetDark)" 
          stroke="rgba(255, 255, 255, 0.25)" 
          stroke-width="1.2" 
          stroke-linejoin="round" />

    <!-- Secondary Interlocking Lower Chevrons -->
    <!-- Lower Left Aerofoil -->
    <path d="M 50,42 L 24,70 L 36,80 L 50,64 Z" 
          fill="url(#aeroFacetTop)" 
          stroke="rgba(255, 255, 255, 0.35)" 
          stroke-width="1.2" 
          stroke-linejoin="round" />

    <!-- Lower Right Aerofoil -->
    <path d="M 50,42 L 76,70 L 64,80 L 50,64 Z" 
          fill="url(#aeroFacetDark)" 
          stroke="rgba(255, 255, 255, 0.2)" 
          stroke-width="1.2" 
          stroke-linejoin="round" />

    <!-- Central Stealth Keel / Supersonic Jet Core -->
    <polygon points="50,18 42,66 50,92 58,66" 
             fill="url(#aeroSpine)" 
             stroke="rgba(255, 255, 255, 0.5)" 
             stroke-width="1.2" 
             stroke-linejoin="round" />

    <!-- Core Facet Split Line for 3D Relief -->
    <polygon points="50,18 50,92 58,66" 
             fill="rgba(0, 0, 0, 0.2)" />
  </g>
</svg>
