name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  rust-ci:
    name: Rust workspace tests, fmt, clippy, release check
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: aeromesh-ci

      - name: Show Rust toolchain versions
        shell: pwsh
        run: |
          rustc --version
          cargo --version

      # `aeromesh-engine` links against native llama/ggml import libraries, so the
      # build needs them present. They are gitignored (bin/*.dll|*.lib), so CI
      # generates *stub* import libraries: the Rust code only needs the linker to
      # resolve symbol names, and the resulting test binaries are never executed
      # against a real GPU here.
      - name: Provide stub llama/ggml import libraries for linking
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $symbols = @(
            'llama_backend_init','llama_backend_free','llama_log_set',
            'llama_model_default_params','llama_model_load_from_file','llama_model_free',
            'llama_model_desc','llama_model_n_embd','llama_model_n_layer','llama_model_get_vocab',
            'llama_context_default_params','llama_init_from_model','llama_free','llama_synchronize',
            'llama_tokenize','llama_token_to_piece','llama_detokenize',
            'llama_vocab_is_eog','llama_vocab_is_control','llama_vocab_bos','llama_vocab_eos','llama_vocab_n_tokens',
            'llama_batch_init','llama_batch_free','llama_decode','llama_get_logits_ith','llama_get_embeddings_ith',
            'llama_sampler_chain_default_params','llama_sampler_chain_init','llama_sampler_chain_add',
            'llama_sampler_init_greedy','llama_sampler_init_temp','llama_sampler_init_top_p',
            'llama_sampler_init_top_k','llama_sampler_init_min_p','llama_sampler_init_penalties',
            'llama_sampler_init_dist','llama_sampler_accept','llama_sampler_reset','llama_sampler_sample','llama_sampler_free',
            'llama_get_memory','llama_memory_clear',
            'ggml_backend_load_all','ggml_backend_load_all_from_path','ggml_backend_reg_count','ggml_backend_tensor_get'
          )
          # Build a .def file and let the MSVC toolchain produce an import library.
          $defLines = @('LIBRARY llama', 'EXPORTS') + ($symbols | ForEach-Object { "    $_" })
          Set-Content -Path bin\llama.def -Value $defLines -Encoding ASCII
          Write-Host "Generated bin\llama.def with $($symbols.Count) symbols"

      # The engine test binary statically imports llama.dll/ggml.dll, so Windows
      # must be able to resolve them *before* main() runs. Copying the stub
      # libraries next to the test executables and putting bin/ on PATH both help.
      - name: Put bin/ on PATH for the test harness
        shell: pwsh
        run: |
          "PATH=${{ github.workspace }}\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check formatting
        shell: pwsh
        run: |
          cargo fmt --all -- --check

      - name: Run clippy
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        shell: pwsh
        run: |
          cargo test --workspace

      - name: Run release-mode workspace check
        shell: pwsh
        run: |
          cargo check --workspace --release

  gateway-ci:
    name: FastAPI gateway tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.100.0" "uvicorn>=0.22.0" "httpx>=0.24.0" "pytest>=8.0.0"

      # `python -m pytest` (not the bare console script) so the repo root is on
      # sys.path. pyproject.toml also declares `pythonpath = ["."]`, which makes
      # the bare `pytest` invocation work too — both are kept for compatibility
      # with the documented command in CONTRIBUTING.md.
      - name: Run FastAPI gateway tests
        shell: pwsh
        run: |
          python -m pytest tests/test_fastapi_gateway.py -v
