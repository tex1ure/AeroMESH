[project]
name = "llama-cluster"
version = "0.1.0"
description = "AI Cluster UI with RPC backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
# Test-only dependencies. Install with:  uv sync --extra dev
# or:                                     pip install -e ".[dev]"
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
# The gateway tests import `app` from the repository root, so the root must be on
# sys.path. Without this, a bare `pytest tests/...` fails with
# "ModuleNotFoundError: No module named 'app'" — which is exactly the command CI
# and CONTRIBUTING.md prescribe.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
